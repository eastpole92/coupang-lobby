<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>구의 로비 3D 탐방 프로토타입</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #cfd8e3; font-family: "Pretendard", "Malgun Gothic", sans-serif; }

    #hud-left {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(24, 28, 36, 0.78);
      color: #f4f6f8;
      padding: 12px 16px;
      border-radius: 10px;
      backdrop-filter: blur(8px);
      line-height: 1.5;
      max-width: 340px;
      font-size: 13px;
    }
    #hud-left h1 { font-size: 15px; margin-bottom: 4px; font-weight: 700; }
    #hud-left .sub { color: #b8c2d1; font-size: 12px; }

    #hud-right {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }
    .status-pill {
      background: rgba(24, 28, 36, 0.78);
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7c8798;
    }
    .dot.active { background: #ff5a79; box-shadow: 0 0 8px #ff5a79; }

    #player-label {
      position: fixed;
      z-index: 9;
      transform: translate(-50%, -100%);
      background: rgba(255, 255, 255, 0.92);
      color: #1c222b;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    #audio-btn {
      display: none;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="hud-left">
    <h1>구의 로비 3D 탐방 프로토타입</h1>
    <div><strong>WASD / 방향키</strong> : 이동 &nbsp;|&nbsp; <strong>마우스 드래그</strong> : 시점 회전</div>
    <div class="sub">로비 속 <em>소연 구역</em> 근처로 가면 “소연 - 퇴사할게요” 음성이 흘러나옵니다.</div>
  </div>

  <div id="hud-right">
    <div class="status-pill" id="step-status">발걸음: 나 느린 발걸음</div>
    <div class="status-pill" id="audio-status">
      <span class="dot" id="audio-dot"></span>
      <span id="audio-text">음성 안내: 대기</span>
    </div>
    <button id="audio-btn">소리 켜기 (클릭)</button>
  </div>

  <div id="player-label">나 느린 발걸음</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. 기본 씬 / 카메라 / 렌더러
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd6e2ee);
    scene.fog = new THREE.Fog(0xd6e2ee, 55, 155);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 240);
    camera.position.set(0, 6.5, 13);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.minDistance = 4;
    controls.maxDistance = 30;

    // 2. 조명
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0xb8b2a6, 1.15);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff7e6, 1.75);
    sunLight.position.set(22, 34, 18);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 2;
    sunLight.shadow.camera.far = 90;
    const d = 28;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    // 3. 로비 바닥 텍스처
    function createFloorTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#bcb6ac';
      ctx.fillRect(0, 0, 512, 512);

      for (let i = 0; i < 4000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const v = 168 + Math.floor(Math.random() * 32);
        ctx.fillStyle = `rgba(${v},${v - 4},${v - 9},0.15)`;
        ctx.fillRect(x, y, 2, 2);
      }

      ctx.strokeStyle = 'rgba(85, 82, 76, 0.25)';
      ctx.lineWidth = 2;
      for (let g = 0; g <= 512; g += 128) {
        ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g, 512); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, g); ctx.lineTo(512, g); ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(14, 14);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(54, 54),
      new THREE.MeshStandardMaterial({ map: createFloorTexture(), roughness: 0.72, metalness: 0.05 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const outerGround = new THREE.Mesh(
      new THREE.PlaneGeometry(240, 240),
      new THREE.MeshStandardMaterial({ color: 0xc5cdd6, roughness: 0.9 })
    );
    outerGround.rotation.x = -Math.PI / 2;
    outerGround.position.y = -0.15;
    scene.add(outerGround);

    // 4. 커튼월 창문 & 구의 이스트폴 주변 빌딩 군집
    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0xdaf0ff,
      transparent: true,
      opacity: 0.25,
      roughness: 0.08,
      metalness: 0.12
    });
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x363d47, roughness: 0.5 });

    const backGlass = new THREE.Mesh(new THREE.PlaneGeometry(54, 15), glassMat);
    backGlass.position.set(0, 7.5, -27);
    scene.add(backGlass);

    const rightGlass = new THREE.Mesh(new THREE.PlaneGeometry(54, 15), glassMat);
    rightGlass.position.set(27, 7.5, 0);
    rightGlass.rotation.y = -Math.PI / 2;
    scene.add(rightGlass);

    for (let i = -24; i <= 24; i += 6) {
      const m1 = new THREE.Mesh(new THREE.BoxGeometry(0.35, 15, 0.35), frameMat);
      m1.position.set(i, 7.5, -26.9);
      scene.add(m1);

      const m2 = new THREE.Mesh(new THREE.BoxGeometry(0.35, 15, 0.35), frameMat);
      m2.position.set(26.9, 7.5, i);
      scene.add(m2);
    }

    function createBuildingFacadeTexture(baseHex, windowHex, cols = 8, rows = 18) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 512, 1024);

      const padX = 16;
      const padY = 18;
      const gapX = 10;
      const gapY = 12;
      const cellW = (512 - padX * 2 - gapX * (cols - 1)) / cols;
      const cellH = (1024 - padY * 2 - gapY * (rows - 1)) / rows;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = padX + c * (cellW + gapX);
          const y = padY + r * (cellH + gapY);
          ctx.fillStyle = ((r + c) % 5 === 0) ? '#9ec2df' : windowHex;
          ctx.fillRect(x, y, cellW, cellH);
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const eastpoleTowerTexA = createBuildingFacadeTexture('#6e7e91', '#7d9db8', 8, 20);
    const eastpoleTowerTexB = createBuildingFacadeTexture('#7d8794', '#8ea9c2', 10, 22);
    const eastpoleResiTex = createBuildingFacadeTexture('#b9b4ac', '#6d8aa3', 9, 18);

    const surroundingBuildings = [
      { x: 44, z: -18, w: 15, h: 48, d: 15, tex: eastpoleTowerTexA },
      { x: 52, z: 4,  w: 18, h: 62, d: 16, tex: eastpoleTowerTexB },
      { x: 42, z: 26, w: 14, h: 40, d: 14, tex: eastpoleResiTex },
      { x: 66, z: -8, w: 16, h: 54, d: 18, tex: eastpoleTowerTexB },

      { x: -16, z: -46, w: 18, h: 52, d: 15, tex: eastpoleTowerTexB },
      { x: 8,   z: -52, w: 20, h: 64, d: 16, tex: eastpoleTowerTexA },
      { x: 30,  z: -44, w: 15, h: 44, d: 14, tex: eastpoleResiTex },
      { x: -38, z: -42, w: 16, h: 38, d: 15, tex: eastpoleResiTex },

      { x: 18,  z: 44,  w: 17, h: 42, d: 15, tex: eastpoleTowerTexA },
      { x: -14, z: 46,  w: 16, h: 36, d: 14, tex: eastpoleResiTex },
      { x: -44, z: -8,  w: 15, h: 45, d: 16, tex: eastpoleTowerTexB },
      { x: -42, z: 22,  w: 16, h: 34, d: 14, tex: eastpoleResiTex }
    ];

    surroundingBuildings.forEach((b) => {
      const mat = new THREE.MeshStandardMaterial({
        map: b.tex,
        roughness: 0.45,
        metalness: 0.2
      });
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h, b.d), mat);
      mesh.position.set(b.x, b.h / 2 - 0.15, b.z);
      scene.add(mesh);
    });

    // 5. 로켓 조형물
    const rocketGroup = new THREE.Group();
    const rocketBody = new THREE.Mesh(
      new THREE.CapsuleGeometry(1.1, 2.5, 12, 24),
      new THREE.MeshStandardMaterial({ color: 0x62b6e8, roughness: 0.35, metalness: 0.15 })
    );
    rocketBody.castShadow = true;
    rocketGroup.add(rocketBody);

    const flame = new THREE.Mesh(
      new THREE.ConeGeometry(0.75, 1.7, 16),
      new THREE.MeshStandardMaterial({ color: 0xff7b29, emissive: 0xff4500, emissiveIntensity: 0.4 })
    );
    flame.rotation.x = Math.PI;
    flame.position.set(0, -2.4, 0);
    rocketGroup.add(flame);

    rocketGroup.position.set(13, 7.5, -10);
    rocketGroup.rotation.z = -0.45;
    scene.add(rocketGroup);

    // 6. 가구 및 화분
    const tableTopMat = new THREE.MeshStandardMaterial({ color: 0x23272e, roughness: 0.4 });
    const legMat = new THREE.MeshStandardMaterial({ color: 0x16181d, roughness: 0.6 });
    const chairCreamMat = new THREE.MeshStandardMaterial({ color: 0xe4d7c5, roughness: 0.8 });
    const chairOrangeMat = new THREE.MeshStandardMaterial({ color: 0xea6a2a, roughness: 0.78 });

    function addCafeSet(x, z, chairMat = chairCreamMat) {
      const group = new THREE.Group();
      const top = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.08, 28), tableTopMat);
      top.position.y = 0.85;
      top.castShadow = true;
      top.receiveShadow = true;
      group.add(top);

      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.42, 0.82, 20), legMat);
      base.position.y = 0.41;
      base.castShadow = true;
      group.add(base);

      [-1.55, 1.55].forEach((offsetX, idx) => {
        const seat = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.52, 0.42, 20), chairMat);
        seat.position.set(offsetX, 0.21, idx === 0 ? 0.2 : -0.2);
        seat.castShadow = true;
        seat.receiveShadow = true;
        group.add(seat);
      });

      group.position.set(x, 0, z);
      scene.add(group);
    }

    addCafeSet(-6, -4, chairCreamMat);
    addCafeSet(2, 2, chairOrangeMat);

    const potMat = new THREE.MeshStandardMaterial({ color: 0xd6cfc2, roughness: 0.7 });
    const leafMat = new THREE.MeshStandardMaterial({ color: 0x3b7a47, roughness: 0.75 });
    [[-8.5, -5.5]].forEach(([px, pz]) => {
      const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.52, 0.9, 20), potMat);
      pot.position.set(px, 0.45, pz);
      pot.castShadow = true;
      scene.add(pot);

      const crown = new THREE.Mesh(new THREE.DodecahedronGeometry(1.3, 1), leafMat);
      crown.position.set(px, 1.8, pz);
      crown.castShadow = true;
      scene.add(crown);
    });

    // 7. 소연 구역 및 NPC
    const soyeonZonePos = new THREE.Vector3(6.5, 0, -4.5);
    const soyeonRadius = 3.6;

    const zoneRing = new THREE.Mesh(
      new THREE.RingGeometry(soyeonRadius - 0.12, soyeonRadius, 64),
      new THREE.MeshBasicMaterial({ color: 0xf472b6, side: THREE.DoubleSide })
    );
    zoneRing.rotation.x = -Math.PI / 2;
    zoneRing.position.set(soyeonZonePos.x, 0.02, soyeonZonePos.z);
    scene.add(zoneRing);

    const npcGroup = new THREE.Group();
    const npcBody = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.45, 0.9, 8, 16),
      new THREE.MeshStandardMaterial({ color: 0xe5989b, roughness: 0.6 })
    );
    npcBody.position.y = 0.9;
    npcBody.castShadow = true;
    npcGroup.add(npcBody);

    const npcHead = new THREE.Mesh(
      new THREE.SphereGeometry(0.42, 20, 20),
      new THREE.MeshStandardMaterial({ color: 0xf6d5c5, roughness: 0.6 })
    );
    npcHead.position.y = 1.85;
    npcHead.castShadow = true;
    npcGroup.add(npcHead);

    npcGroup.position.copy(soyeonZonePos);
    scene.add(npcGroup);

    // 8. 플레이어 캐릭터 (복잡한 파츠 구성: 코트 몸통 + 양팔 + 양다리/신발 + 머리 + 파란 캡모자)
    const player = new THREE.Group();
    const coatMat = new THREE.MeshStandardMaterial({ color: 0x6ba4cf, roughness: 0.65 });
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xe5b69e, roughness: 0.65 });
    const capMat = new THREE.MeshStandardMaterial({ color: 0x5592c2, roughness: 0.5 });
    const shoeMat = new THREE.MeshStandardMaterial({ color: 0x2f3542, roughness: 0.7 });

    // 몸통(코트)
    const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.44, 0.85, 10, 20), coatMat);
    torso.position.y = 1.15;
    torso.castShadow = true;
    player.add(torso);

    // 머리
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 24, 24), skinMat);
    head.position.y = 1.96;
    head.castShadow = true;
    player.add(head);

    // 파란 캡모자(돔 + 챙)
    const capDome = new THREE.Mesh(
      new THREE.SphereGeometry(0.45, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.55),
      capMat
    );
    capDome.position.set(0, 2.02, 0.03);
    capDome.castShadow = true;
    player.add(capDome);

    const capBrim = new THREE.Mesh(new THREE.BoxGeometry(0.64, 0.06, 0.42), capMat);
    capBrim.position.set(0, 2.08, 0.42);
    capBrim.castShadow = true;
    player.add(capBrim);

    // 양팔
    const leftArm = new THREE.Group();
    const lArmMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.14, 0.58, 8, 14), coatMat);
    lArmMesh.position.y = -0.28;
    lArmMesh.castShadow = true;
    leftArm.add(lArmMesh);
    leftArm.position.set(-0.56, 1.48, 0);
    player.add(leftArm);

    const rightArm = new THREE.Group();
    const rArmMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.14, 0.58, 8, 14), coatMat);
    rArmMesh.position.y = -0.28;
    rArmMesh.castShadow = true;
    rightArm.add(rArmMesh);
    rightArm.position.set(0.56, 1.48, 0);
    player.add(rightArm);

    // 양다리 & 신발
    const leftLeg = new THREE.Group();
    const lLegMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.13, 0.55, 14), shoeMat);
    lLegMesh.position.y = -0.28;
    lLegMesh.castShadow = true;
    leftLeg.add(lLegMesh);
    const lShoe = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.14, 0.38), shoeMat);
    lShoe.position.set(0, -0.55, 0.06);
    lShoe.castShadow = true;
    leftLeg.add(lShoe);
    leftLeg.position.set(-0.22, 0.62, 0);
    player.add(leftLeg);

    const rightLeg = new THREE.Group();
    const rLegMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.13, 0.55, 14), shoeMat);
    rLegMesh.position.y = -0.28;
    rLegMesh.castShadow = true;
    rightLeg.add(rLegMesh);
    const rShoe = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.14, 0.38), shoeMat);
    rShoe.position.set(0, -0.55, 0.06);
    rShoe.castShadow = true;
    rightLeg.add(rShoe);
    rightLeg.position.set(0.22, 0.62, 0);
    player.add(rightLeg);

    player.position.set(0, 0, 5);
    scene.add(player);

    // 9. 오디오 & 소연 구역 트리거
    const listener = new THREE.AudioListener();
    camera.add(listener);
    const soyeonSound = new THREE.Audio(listener);
    const audioLoader = new THREE.AudioLoader();

    audioLoader.load('./soyeon_resign.mp3', (buffer) => {
      soyeonSound.setBuffer(buffer);
      soyeonSound.setLoop(false);
      soyeonSound.setVolume(0.8);
    }, undefined, () => {
      console.warn('soyeon_resign.mp3 파일을 찾지 못했습니다.');
    });

    const stepStatusEl = document.getElementById('step-status');
    const audioDotEl = document.getElementById('audio-dot');
    const audioTextEl = document.getElementById('audio-text');
    const audioBtnEl = document.getElementById('audio-btn');
    const playerLabelEl = document.getElementById('player-label');

    let isInSoyeonZone = false;

    function setZoneUI(active) {
      if (active) {
        stepStatusEl.textContent = '발걸음: 소연 구역';
        playerLabelEl.textContent = '소연 구역';
        audioDotEl.classList.add('active');
        audioTextEl.textContent = '음성 안내: 활성 (소연 - 퇴사할게요)';
      } else {
        stepStatusEl.textContent = '발걸음: 나 느린 발걸음';
        playerLabelEl.textContent = '나 느린 발걸음';
        audioDotEl.classList.remove('active');
        audioTextEl.textContent = '음성 안내: 대기';
      }
    }

    audioBtnEl.addEventListener('click', async () => {
      if (listener.context.state === 'suspended') {
        await listener.context.resume();
      }
      if (soyeonSound.buffer && !soyeonSound.isPlaying) {
        soyeonSound.play();
      }
      audioBtnEl.style.display = 'none';
    });

    function checkSoyeonZone() {
      const dist = Math.hypot(player.position.x - soyeonZonePos.x, player.position.z - soyeonZonePos.z);
      const inside = dist <= soyeonRadius;

      if (inside && !isInSoyeonZone) {
        isInSoyeonZone = true;
        setZoneUI(true);

        if (listener.context.state === 'suspended') {
          listener.context.resume().catch(() => {});
        }
        if (soyeonSound.buffer && !soyeonSound.isPlaying) {
          try {
            soyeonSound.play();
            audioBtnEl.style.display = 'none';
          } catch {
            audioBtnEl.style.display = 'inline-block';
          }
        }
      } else if (!inside && isInSoyeonZone) {
        isInSoyeonZone = false;
        setZoneUI(false);
        if (soyeonSound.isPlaying) {
          soyeonSound.stop();
        }
      }
    }

    // 10. 이동 입력, 팔·다리 스윙 및 카메라 팔로우
    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false;
