<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사내 로비 3D 탐방 프로토타입</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #dce3ec;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      color: #1f2937;
    }

    #scene-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .panel {
      position: fixed;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      z-index: 10;
    }

    .info-box {
      top: 16px;
      left: 16px;
      max-width: 340px;
      padding: 14px 16px;
    }

    .info-box h1 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #111827;
    }

    .info-box p {
      font-size: 12px;
      line-height: 1.5;
      color: #4b5563;
      margin-bottom: 10px;
    }

    .controls-hint {
      font-size: 11px;
      color: #374151;
      line-height: 1.5;
    }

    .top-right-bar {
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      padding: 8px;
    }

    .bottom-zones {
      bottom: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      font-size: 12px;
    }

    button {
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #111827;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    button:hover {
      background: #f3f4f6;
    }

    button.active {
      background: #111827;
      color: #ffffff;
      border-color: #111827;
    }

    #error-banner {
      display: none;
      position: fixed;
      left: 16px;
      bottom: 16px;
      max-width: 460px;
      padding: 10px 14px;
      border-radius: 10px;
      background: #991b1b;
      color: #ffffff;
      font-size: 12px;
      z-index: 20;
    }
  </style>
</head>
<body>
  <canvas id="scene-canvas"></canvas>

  <div class="panel info-box">
    <h1>사내 로비 라운지 산책</h1>
    <p>커튼월 통유리로 맑은 채광이 들어오는 1층 화이트 라운지입니다. 자유롭게 걸어 다니며 공간을 둘러보세요.</p>
    <div class="controls-hint">
      <strong>WASD / 방향키</strong> 이동 · <strong>마우스 드래그</strong> 시점 회전 · <strong>휠</strong> 확대/축소
    </div>
  </div>

  <div class="panel top-right-bar">
    <button id="btn-slow-walk" type="button">🚶 느린 발걸음 전환</button>
    <button id="btn-reset-view" type="button">🏠 로비 중앙</button>
    <button id="btn-camera-mode" type="button">🎥 시점 전환</button>
  </div>

  <div class="panel bottom-zones">
    <span><strong>탐방 구역:</strong></span>
    <button type="button" data-pos="0,2.2,8" data-target="0,2,0">쿠팡 로켓 보드</button>
    <button type="button" data-pos="7,3.5,5" data-target="6,3,0">나선형 계단</button>
    <button type="button" data-pos="-6,5.5,6" data-target="-5,4.5,-2">2F 컬러 푸프 라운지</button>
    <button type="button" data-pos="0,2.5,-8" data-target="0,2,0">커튼월 라운지</button>
  </div>

  <div id="error-banner"></div>

  <script type="module">
    import * as THREE from 'https://esm.sh/three@0.169.0';
    import { OrbitControls } from 'https://esm.sh/three@0.169.0/examples/jsm/controls/OrbitControls.js';

    const canvas = document.getElementById('scene-canvas');
    const errorBanner = document.getElementById('error-banner');

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = 'block';
    }

    try {
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        powerPreference: 'default'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#dfe7f0');

      const camera = new THREE.PerspectiveCamera(
        55,
        window.innerWidth / window.innerHeight,
        0.1,
        200
      );
      const defaultCamPos = new THREE.Vector3(0, 3.2, 13);
      const defaultTarget = new THREE.Vector3(0, 2.2, 0);
      camera.position.copy(defaultCamPos);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.copy(defaultTarget);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxPolarAngle = Math.PI * 0.49;
      controls.update();

      // 조명
      const hemiLight = new THREE.HemisphereLight('#ffffff', '#cbd5e1', 1.3);
      hemiLight.position.set(0, 20, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight('#fffbeb', 1.5);
      dirLight.position.set(10, 18, 12);
      scene.add(dirLight);

      // 1층 화이트 바닥
      const floorGeo = new THREE.BoxGeometry(28, 0.4, 24);
      const floorMat = new THREE.MeshStandardMaterial({ color: '#f8fafc', roughness: 0.6 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.position.set(0, -0.2, 0);
      scene.add(floor);

      // 2층 데크 일부
      const secondFloorGeo = new THREE.BoxGeometry(12, 0.3, 10);
      const secondFloorMat = new THREE.MeshStandardMaterial({ color: '#e2e8f0', roughness: 0.7 });
      const secondFloor = new THREE.Mesh(secondFloorGeo, secondFloorMat);
      secondFloor.position.set(-5, 4.2, -2);
      scene.add(secondFloor);

      // 중앙 로켓 조형물
      const rocketGroup = new THREE.Group();
      const bodyMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.7, 0.9, 3.2, 24),
        new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.35 })
      );
      bodyMesh.position.y = 1.6;
      const noseMesh = new THREE.Mesh(
        new THREE.ConeGeometry(0.7, 1.3, 24),
        new THREE.MeshStandardMaterial({ color: '#e11d48', roughness: 0.4 })
      );
      noseMesh.position.y = 3.85;
      rocketGroup.add(bodyMesh, noseMesh);
      rocketGroup.position.set(0, 0, 0);
      scene.add(rocketGroup);

      // 나선형 계단(심플 스텝 배치)
      const stepGeo = new THREE.BoxGeometry(1.8, 0.16, 0.7);
      const stepMat = new THREE.MeshStandardMaterial({ color: '#94a3b8', roughness: 0.5 });
      for (let i = 0; i < 18; i++) {
        const angle = i * 0.35;
        const radius = 2.4;
        const step = new THREE.Mesh(stepGeo, stepMat);
        step.position.set(
          6 + Math.cos(angle) * radius,
          0.25 * (i + 1),
          Math.sin(angle) * radius
        );
        step.rotation.y = -angle + Math.PI / 2;
        scene.add(step);
      }

      // 2F 컬러 푸프
      const poufColors = ['#fb7185', '#38bdf8', '#facc15', '#34d399'];
      poufColors.forEach((hex, idx) => {
        const pouf = new THREE.Mesh(
          new THREE.CylinderGeometry(0.65, 0.7, 0.45, 20),
          new THREE.MeshStandardMaterial({ color: hex, roughness: 0.8 })
        );
        pouf.position.set(-7 + idx * 1.6, 4.58, -1.5 + (idx % 2) * 1.5);
        scene.add(pouf);
      });

      // 커튼월 프레임
      const frameMat = new THREE.MeshStandardMaterial({ color: '#64748b', metalness: 0.3, roughness: 0.4 });
      for (let x = -12; x <= 12; x += 4) {
        const mullion = new THREE.Mesh(new THREE.BoxGeometry(0.14, 7.5, 0.14), frameMat);
        mullion.position.set(x, 3.75, -11.5);
        scene.add(mullion);
      }

      // 이동 및 버튼 상태
      const keys = new Set();
      let slowWalk = false;
      let firstPerson = false;

      window.addEventListener('keydown', (e) => keys.add(e.code));
      window.addEventListener('keyup', (e) => keys.delete(e.code));

      const btnSlow = document.getElementById('btn-slow-walk');
      btnSlow.addEventListener('click', () => {
        slowWalk = !slowWalk;
        btnSlow.classList.toggle('active', slowWalk);
      });

      document.getElementById('btn-reset-view').addEventListener('click', () => {
        camera.position.copy(defaultCamPos);
        controls.target.copy(defaultTarget);
        controls.update();
      });

      const btnCam = document.getElementById('btn-camera-mode');
      btnCam.addEventListener('click', () => {
        firstPerson = !firstPerson;
        btnCam.classList.toggle('active', firstPerson);
        if (firstPerson) {
          camera.position.set(0, 1.7, 9);
          controls.target.set(0, 1.7, 0);
        } else {
          camera.position.copy(defaultCamPos);
          controls.target.copy(defaultTarget);
        }
        controls.update();
      });

      document.querySelectorAll('[data-pos]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const [px, py, pz] = btn.dataset.pos.split(',').map(Number);
          const [tx, ty, tz] = btn.dataset.target.split(',').map(Number);
          camera.position.set(px, py, pz);
          controls.target.set(tx, ty, tz);
          controls.update();
        });
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const delta = Math.min(clock.getDelta(), 0.05);
        const speed = (slowWalk ? 2.2 : 5.5) * delta;

        const forward = new THREE.Vector3();
        camera.getWorldDirection(forward);
        forward.y = 0;
        if (forward.lengthSq() > 0) forward.normalize();

        const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
        const move = new THREE.Vector3();

        if (keys.has('KeyW') || keys.has('ArrowUp')) move.add(forward);
        if (keys.has('KeyS') || keys.has('ArrowDown')) move.sub(forward);
        if (keys.has('KeyD') || keys.has('ArrowRight')) move.add(right);
        if (keys.has('KeyA') || keys.has('ArrowLeft')) move.sub(right);

        if (move.lengthSq() > 0) {
          move.normalize().multiplyScalar(speed);
          camera.position.add(move);
          controls.target.add(move);
        }

        controls.update();
        renderer.render(scene, camera);
      }

      animate();
    } catch (err) {
      showError('3D 씬 초기화 중 오류 발생: ' + (err && err.message ? err.message : String(err)));
    }
  </script>
</body>
</html>
