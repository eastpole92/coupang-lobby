<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>구의 로비 3D 탐방 프로토타입</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #cfd8e3; font-family: "Pretendard", "Malgun Gothic", sans-serif; }

    /* 좌상단 안내 패널 */
    #hud-left {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(24, 28, 36, 0.78);
      color: #f4f6f8;
      padding: 12px 16px;
      border-radius: 10px;
      backdrop-filter: blur(8px);
      line-height: 1.5;
      max-width: 340px;
      font-size: 13px;
    }
    #hud-left h1 { font-size: 15px; margin-bottom: 4px; font-weight: 700; }
    #hud-left .sub { color: #b8c2d1; font-size: 12px; }

    /* 우상단 상태 패널 */
    #hud-right {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }
    .status-pill {
      background: rgba(24, 28, 36, 0.78);
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7c8798;
    }
    .dot.active { background: #ff5a79; box-shadow: 0 0 8px #ff5a79; }

    /* 캐릭터 머리 위 3D 라벨 */
    #player-label {
      position: fixed;
      z-index: 9;
      transform: translate(-50%, -100%);
      background: rgba(255, 255, 255, 0.92);
      color: #1c222b;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    /* 오디오 자동재생 차단 대비 안내 버튼 */
    #audio-btn {
      display: none;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="hud-left">
    <h1>구의 로비 3D 탐방 프로토타입</h1>
    <div><strong>WASD / 방향키</strong> : 이동 &nbsp;|&nbsp; <strong>마우스 드래그</strong> : 시점 회전</div>
    <div class="sub">로비 속 <em>소연 구역</em> 근처로 가면 “소연 - 퇴사할게요” 음성이 흘러나옵니다.</div>
  </div>

  <div id="hud-right">
    <div class="status-pill" id="step-status">발걸음: 나 느린 발걸음</div>
    <div class="status-pill" id="audio-status">
      <span class="dot" id="audio-dot"></span>
      <span id="audio-text">음성 안내: 대기</span>
    </div>
    <button id="audio-btn">소리 켜기 (클릭)</button>
  </div>

  <div id="player-label">나 느린 발걸음</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. 기본 씬 / 카메라 / 렌더러
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd6e2ee);
    scene.fog = new THREE.Fog(0xd6e2ee, 38, 95);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 160);
    camera.position.set(0, 6.5, 13);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.minDistance = 4;
    controls.maxDistance = 28;

    // 2. 조명 (실내 간접광 + 창가 자연광)
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0xb8b2a6, 1.15);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff7e6, 1.8);
    sunLight.position.set(18, 22, 10);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 2;
    sunLight.shadow.camera.far = 70;
    const d = 24;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    // 3. 바닥 텍스처(타일/톤 변화) 생성 및 배치
    function createFloorTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#b9b4ab';
      ctx.fillRect(0, 0, 512, 512);

      // 은은한 노이즈/질감
      for (let i = 0; i < 4500; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const v = 165 + Math.floor(Math.random() * 35);
        ctx.fillStyle = `rgba(${v},${v - 4},${v - 10},0.16)`;
        ctx.fillRect(x, y, 2, 2);
      }

      // 타일 라인
      ctx.strokeStyle = 'rgba(90, 86, 80, 0.25)';
      ctx.lineWidth = 2;
      for (let g = 0; g <= 512; g += 128) {
        ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g, 512); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, g); ctx.lineTo(512, g); ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(14, 14);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(54, 54),
      new THREE.MeshStandardMaterial({ map: createFloorTexture(), roughness: 0.72, metalness: 0.05 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // 4. 벽면, 대형 통창, 외부 빌딩 실루엣, 천장 그리드
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xeef1f5, roughness: 0.85 });
    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0xd9ecff,
      transparent: true,
      opacity: 0.28,
      roughness: 0.1,
      metalness: 0.1
    });
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x3b424c, roughness: 0.5 });

    // 뒤쪽 벽(-Z)
    const backWall = new THREE.Mesh(new THREE.BoxGeometry(54, 16, 0.6), wallMat);
    backWall.position.set(0, 8, -22);
    backWall.receiveShadow = true;
    scene.add(backWall);

    // 오른쪽 통창(+X) + 창살 프레임
    const rightGlass = new THREE.Mesh(new THREE.PlaneGeometry(44, 15), glassMat);
    rightGlass.position.set(22, 7.5, 0);
    rightGlass.rotation.y = -Math.PI / 2;
    scene.add(rightGlass);

    for (let z = -18; z <= 18; z += 6) {
      const mullion = new THREE.Mesh(new THREE.BoxGeometry(0.35, 15, 0.35), frameMat);
      mullion.position.set(21.9, 7.5, z);
      scene.add(mullion);
    }

    // 창밖 외부 빌딩 매스
    const buildingMat = new THREE.MeshStandardMaterial({ color: 0x8fa3b8, roughness: 0.6 });
    const bldgPositions = [
      [34, 14, -12, 8, 28, 8],
      [36, 17, 2, 9, 34, 9],
      [33, 12, 15, 7, 24, 7]
    ];
    bldgPositions.forEach(([x, y, z, w, h, dBox]) => {
      const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, dBox), buildingMat);
      b.position.set(x, y, z);
      scene.add(b);
    });

    // 천장 격자 & 조명 라인
    for (let x = -18; x <= 18; x += 6) {
      const beam = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 44), frameMat);
      beam.position.set(x, 15.2, 0);
      scene.add(beam);
    }
    const lightStripMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    for (let z = -14; z <= 14; z += 7) {
      const strip = new THREE.Mesh(new THREE.BoxGeometry(36, 0.12, 0.35), lightStripMat);
      strip.position.set(2, 15.1, z);
      scene.add(strip);
    }

    // 5. 로비 랜드마크: 대형 쿠팡 스크린 & 로켓 조형물
    function createCoupangBannerTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 384;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 1024, 384);

      ctx.font = 'bold 112px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // 쿠팡 포인트 컬러 느낌의 그라데이션 텍스트
      const grad = ctx.createLinearGradient(260, 0, 760, 0);
      grad.addColorStop(0.0, '#2e7d32');
      grad.addColorStop(0.35, '#e53935');
      grad.addColorStop(0.7, '#fb8c00');
      grad.addColorStop(1.0, '#1e88e5');
      ctx.fillStyle = grad;
      ctx.fillText('coupang', 512, 192);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const screenMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(14, 5.2),
      new THREE.MeshBasicMaterial({ map: createCoupangBannerTexture() })
    );
    screenMesh.position.set(-7, 5.5, -21.6);
    scene.add(screenMesh);

    // 로켓 조형물
    const rocketGroup = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x62b6e8, roughness: 0.35, metalness: 0.15 });
    const finMat = new THREE.MeshStandardMaterial({ color: 0x2574b8, roughness: 0.4 });
    const flameMat = new THREE.MeshStandardMaterial({ color: 0xff7b29, emissive: 0xff4500, emissiveIntensity: 0.4 });

    const rocketBody = new THREE.Mesh(new THREE.CapsuleGeometry(1.15, 2.6, 12, 24), bodyMat);
    rocketBody.castShadow = true;
    rocketGroup.add(rocketBody);

    const flame = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1.8, 16), flameMat);
    flame.rotation.x = Math.PI;
    flame.position.set(0, -2.5, 0);
    rocketGroup.add(flame);

    [-1, 1].forEach((dir) => {
      const fin = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.5, 1.1), finMat);
      fin.position.set(dir * 1.1, -1.1, 0);
      fin.rotation.z = dir * 0.35;
      rocketGroup.add(fin);
    });

    rocketGroup.position.set(13, 7.5, -9);
    rocketGroup.rotation.z = -0.45;
    scene.add(rocketGroup);

    // 6. 가구(테이블, 암체어) & 화분 배치
    const tableTopMat = new THREE.MeshStandardMaterial({ color: 0x23272e, roughness: 0.4 });
    const legMat = new THREE.MeshStandardMaterial({ color: 0x16181d, roughness: 0.6 });
    const chairCreamMat = new THREE.MeshStandardMaterial({ color: 0xe4d7c5, roughness: 0.8 });
    const chairYellowMat = new THREE.MeshStandardMaterial({ color: 0xeab308, roughness: 0.78 });
    const chairOrangeMat = new THREE.MeshStandardMaterial({ color: 0xea6a2a, roughness: 0.78 });

    function addCafeSet(x, z, chairMat = chairCreamMat) {
      const group = new THREE.Group();
      const top = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.08, 28), tableTopMat);
      top.position.y = 0.85;
      top.castShadow = true;
      top.receiveShadow = true;
      group.add(top);

      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.42, 0.82, 20), legMat);
      base.position.y = 0.41;
      base.castShadow = true;
      group.add(base);

      // 의자 2개
      [-1.55, 1.55].forEach((offsetX, idx) => {
        const seat = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.52, 0.42, 20), chairMat);
        seat.position.set(offsetX, 0.21, idx === 0 ? 0.2 : -0.2);
        seat.castShadow = true;
        seat.receiveShadow = true;
        group.add(seat);

        const back = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.45, 20, 1, true, 0, Math.PI), chairMat);
        back.position.set(offsetX, 0.52, idx === 0 ? 0.2 : -0.2);
        back.rotation.y = idx === 0 ? Math.PI : 0;
        back.castShadow = true;
        group.add(back);
      });

      group.position.set(x, 0, z);
      scene.add(group);
    }

    addCafeSet(-6, -4, chairYellowMat);
    addCafeSet(-1, 2, chairCreamMat);
    addCafeSet(8, 2, chairOrangeMat);
    addCafeSet(-11, -10, chairYellowMat);

    // 화분 배치
    const potMat = new THREE.MeshStandardMaterial({ color: 0xd6cfc2, roughness: 0.7 });
    const leafMat = new THREE.MeshStandardMaterial({ color: 0x3b7a47, roughness: 0.75 });
    [[-16, -14], [-16, 4], [17, -15]].forEach(([px, pz]) => {
      const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.52, 0.9, 20), potMat);
      pot.position.set(px, 0.45, pz);
      pot.castShadow = true;
      scene.add(pot);

      const crown = new THREE.Mesh(new THREE.DodecahedronGeometry(1.35, 1), leafMat);
      crown.position.set(px, 1.85, pz);
      crown.castShadow = true;
      scene.add(crown);
    });

    // 7. 소연 구역(상호작용 구역) 마커 및 NPC
    const soyeonZonePos = new THREE.Vector3(6.5, 0, -4.5);
    const soyeonRadius = 3.6;

    const zoneRing = new THREE.Mesh(
      new THREE.RingGeometry(soyeonRadius - 0.12, soyeonRadius, 64),
      new THREE.MeshBasicMaterial({ color: 0xf472b6, side: THREE.DoubleSide })
    );
    zoneRing.rotation.x = -Math.PI / 2;
    zoneRing.position.set(soyeonZonePos.x, 0.02, soyeonZonePos.z);
    scene.add(zoneRing);

    const npcGroup = new THREE.Group();
    const npcBody = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.45, 0.9, 8, 16),
      new THREE.MeshStandardMaterial({ color: 0xe5989b, roughness: 0.6 })
    );
    npcBody.position.y = 0.9;
    npcBody.castShadow = true;
    npcGroup.add(npcBody);

    const npcHead = new THREE.Mesh(
      new THREE.SphereGeometry(0.42, 20, 20),
      new THREE.MeshStandardMaterial({ color: 0xf6d5c5, roughness: 0.6 })
    );
    npcHead.position.y = 1.85;
    npcHead.castShadow = true;
    npcGroup.add(npcHead);

    npcGroup.position.copy(soyeonZonePos);
    scene.add(npcGroup);

    // 8. 플레이어 캐릭터 (파란 모자 피규어)
    const player = new THREE.Group();
    const coat = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.48, 0.95, 10, 20),
      new THREE.MeshStandardMaterial({ color: 0x7fb3d5, roughness: 0.6 })
    );
    coat.position.y = 0.95;
    coat.castShadow = true;
    player.add(coat);

    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.45, 24, 24),
      new THREE.MeshStandardMaterial({ color: 0xf0c7b2, roughness: 0.6 })
    );
    head.position.y = 1.92;
    head.castShadow = true;
    player.add(head);

    const capMat = new THREE.MeshStandardMaterial({ color: 0x6ea8d6, roughness: 0.5 });
    const capTop = new THREE.Mesh(
      new THREE.SphereGeometry(0.48, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.55),
      capMat
    );
    capTop.position.y = 1.96;
    capTop.castShadow = true;
    player.add(capTop);

    const brim = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.06, 0.45), capMat);
    brim.position.set(0, 2.02, 0.42);
    brim.castShadow = true;
    player.add(brim);

    player.position.set(0, 0, 5);
    scene.add(player);

    // 9. 오디오 & 소연 구역 트리거
    const listener = new THREE.AudioListener();
    camera.add(listener);
    const soyeonSound = new THREE.Audio(listener);
    const audioLoader = new THREE.AudioLoader();

    // 같은 폴더에 soyeon_resign.mp3 파일을 두세요.
    audioLoader.load('./soyeon_resign.mp3', (buffer) => {
      soyeonSound.setBuffer(buffer);
      soyeonSound.setLoop(false);
      soyeonSound.setVolume(0.8);
    }, undefined, () => {
      // 파일이 아직 없을 때도 UI 상태 변화 테스트가 가능하도록 처리
      console.warn('soyeon_resign.mp3 파일을 찾지 못했습니다. UI 상태만 전환됩니다.');
    });

    const stepStatusEl = document.getElementById('step-status');
    const audioDotEl = document.getElementById('audio-dot');
    const audioTextEl = document.getElementById('audio-text');
    const audioBtnEl = document.getElementById('audio-btn');
    const playerLabelEl = document.getElementById('player-label');

    let isInSoyeonZone = false;

    function setZoneUI(active) {
      if (active) {
        stepStatusEl.textContent = '발걸음: 소연 구역';
        playerLabelEl.textContent = '소연 구역';
        audioDotEl.classList.add('active');
        audioTextEl.textContent = '음성 안내: 활성 (소연 - 퇴사할게요)';
      } else {
        stepStatusEl.textContent = '발걸음: 나 느린 발걸음';
        playerLabelEl.textContent = '나 느린 발걸음';
        audioDotEl.classList.remove('active');
        audioTextEl.textContent = '음성 안내: 대기';
      }
    }

    audioBtnEl.addEventListener('click', async () => {
      if (listener.context.state === 'suspended') {
        await listener.context.resume();
      }
      if (soyeonSound.buffer && !soyeonSound.isPlaying) {
        soyeonSound.play();
      }
      audioBtnEl.style.display = 'none';
    });

    function checkSoyeonZone() {
      const dist = Math.hypot(player.position.x - soyeonZonePos.x, player.position.z - soyeonZonePos.z);
      const inside = dist <= soyeonRadius;

      if (inside && !isInSoyeonZone) {
        isInSoyeonZone = true;
        setZoneUI(true);

        if (listener.context.state === 'suspended') {
          listener.context.resume().catch(() => {});
        }
        if (soyeonSound.buffer && !soyeonSound.isPlaying) {
          try {
            soyeonSound.play();
            audioBtnEl.style.display = 'none';
          } catch {
            audioBtnEl.style.display = 'inline-block';
          }
        }
      } else if (!inside && isInSoyeonZone) {
        isInSoyeonZone = false;
        setZoneUI(false);
        if (soyeonSound.isPlaying) {
          soyeonSound.stop();
        }
      }
    }

    // 10. 이동 입력 및 카메라 팔로우
    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    const cameraOffset = new THREE.Vector3(0, 6.2, 10.5);
    const tempVec = new THREE.Vector3();

    function updateMovement() {
      let moveX = 0;
      let moveZ = 0;
      if (keys['KeyW'] || keys['ArrowUp']) moveZ -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) moveZ += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

      if (moveX !== 0 || moveZ !== 0) {
        const len = Math.hypot(moveX, moveZ);
        moveX /= len;
        moveZ /= len;

        // 카메라 수평 방향 기준으로 이동
        const forward = new THREE.Vector3();
        camera.getWorldDirection(forward);
        forward.y = 0;
        forward.normalize();

        const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

        const deltaMove = new THREE.Vector3()
          .addScaledVector(right, moveX * 0.14)
          .addScaledVector(forward, -moveZ * 0.14);

        player.position.add(deltaMove);
        player.position.x = THREE.MathUtils.clamp(player.position.x, -19, 19);
        player.position.z = THREE.MathUtils.clamp(player.position.z, -19, 19);

        const targetAngle = Math.atan2(deltaMove.x, deltaMove.z);
        player.rotation.y = targetAngle;

        camera.position.add(deltaMove);
      }

      controls.target.lerp(tempVec.set(player.position.x, 1.5, player.position.z), 0.15);
      controls.update();

      // 플레이어 머리 위 2D 라벨 위치 동기화
      const labelPos = new THREE.Vector3(player.position.x, 2.75, player.position.z).project(camera);
      const isBehind = labelPos.z > 1;
      playerLabelEl.style.display = isBehind ? 'none' : 'block';
      playerLabelEl.style.left = `${(labelPos.x * 0.5 + 0.5) * window.innerWidth}px`;
      playerLabelEl.style.top = `${(-labelPos.y * 0.5 + 0.5) * window.innerHeight}px`;
    }

    // 11. 루프 & 리사이즈
    function animate() {
      requestAnimationFrame(animate);
      updateMovement();
      checkSoyeonZone();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
